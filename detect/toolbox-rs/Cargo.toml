[package]
name = "toolbox-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "toolbox-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
axum-extra = { version = "0.9", features = ["query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }
tower-http = { version = "0.5", features = ["fs", "trace", "compression-gzip", "compression-br", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
