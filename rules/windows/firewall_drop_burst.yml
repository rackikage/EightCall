title: Windows Firewall Drop to SMB or RDP
id: 8f2c1a44-5d3b-4c7e-9a10-2b6e4f8d1c01
status: experimental
description: A single firewall drop toward SMB (445) or RDP (3389).
references:
  - https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/configure-logging
author: Eight Call
date: 2026-09-21
tags:
  - attack.t1021.002
logsource:
