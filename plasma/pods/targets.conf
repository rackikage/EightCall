#!/usr/bin/env bash
# targets.conf — one alias=ip per line. Comments start with #.
# Stock iOS / iPadOS devices on the LAN. The controller probes them; they
# do NOT run pods themselves.

iphone01=192.168.8.120
iphone02=192.168.8.121
ipad01=192.168.8.122

# Add more here. The watcher scans every alias every $WATCH_INTERVAL_SECONDS.
# The rotator only dispatches when A emits a state-change trigger and the
# target is currently UP and not in cooldown.

# Notes for stock iOS:
#   * 5353/udp is mDNS — iOS devices advertise _apple-mobdev2._tcp.local.
#   * 62078/tcp is iOS lockdown (paired devices; won't respond otherwise).
#   * iOS does not advertise SSH by default. Arbitrary on-device execution
#     requires a paired lockdown client, an agent app you ship yourself, or
#     a jailbroken environment. The pods do not assume any of these.