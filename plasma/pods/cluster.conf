# cluster.conf — CLUSTER LAW v1 enrollment ledger.
#
# Format (tab-separated): pod_name<TAB>device_id<TAB>status<TAB>capabilities
#   status         "enabled" or "disabled"
#   capabilities   comma-separated, no spaces, e.g. health,probe,inventory
#
# The ONLY sanctioned way to add or change a row is:
#     cluster.sh enroll  --pod NAME --device-id ID --caps a,b,c [--force]
#     cluster.sh disable --pod NAME
#     cluster.sh enable  --pod NAME
#     cluster.sh rename  --old NAME --new NAME2
# Hand-editing bypasses the uniqueness/reassignment checks those commands
# enforce — if you must, run `cluster.sh validate` immediately after.
#
# This file ships EMPTY on purpose. "DISCOVERY never equals enrollment" and
# "UNKNOWN TARGET never becomes a pod automatically" (CLUSTER_LAW.md) mean a
# target in targets.conf is not authorized for dispatch until an operator
# explicitly enrolls it here with a device_id THEY assert. Nothing in this
# repo can determine a stable device_id for a stock iOS target on its own
# (see targets.conf's own notes on why) — auto-populating this file would
# itself be exactly the auto-enrollment the law forbids.
#
# Example (inert; uncomment and edit the values, or run `cluster.sh enroll`):
# example-pod	example-device-id-001	enabled	health,probe,inventory
