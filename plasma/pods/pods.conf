# pods.conf — sourced by every pods/ script.
#
# Override any of these in the environment BEFORE invoking a script, e.g.
#     PODS_HOME=/srv/pods ./rotator.sh
# or edit this file in place (the installer copies it to $PODS_HOME/pods.conf).

: "${PODS_HOME:=${HOME}/pods}"

# Where the daemon-state and run records live. The installer creates them.
: "${PODS_LOG:=${PODS_HOME}/pods.log}"
: "${PODS_RUNS:=${PODS_HOME}/runs.jsonl}"
: "${PODS_STATE:=${PODS_HOME}/state}"
: "${PODS_TARGETS:=${PODS_HOME}/targets.conf}"
: "${PODS_PIDS:=${PODS_HOME}/pids}"
: "${PODS_LOCKS:=${PODS_HOME}/locks}"

# CLUSTER LAW v1 (see CLUSTER_LAW.md): the enrollment ledger (device_id +
# capability grants per pod) and its audit log. The ONLY sanctioned writer
# to $CLUSTER_CONF is cluster.sh; pod.sh (via lib_safety_gate.sh) only reads.
: "${CLUSTER_CONF:=${PODS_HOME}/cluster.conf}"
: "${CLUSTER_LOG:=${PODS_HOME}/cluster.log}"

# Sentinel files. Touching $PODS_STOP asks the daemons to exit at their
# next loop boundary (every $WATCH_INTERVAL_SECONDS at most). killswitch.sh
# touches it, then waits up to $FIRE_GRACE_SECONDS for a clean exit.
: "${PODS_STOP:=${PODS_HOME}/.stop}"

# Tunables.
: "${WATCH_INTERVAL_SECONDS:=60}"
: "${PING_COUNT:=1}"
: "${PING_TIMEOUT_SECONDS:=2}"
: "${PROBE_TIMEOUT_SECONDS:=2}"
# comma-separated host:port list, expanded below into $PROBE_TARGETS
: "${PROBE_PORTS:=80,443,5353,8080,8443,62078}"
: "${ROTATE_INTERVAL_SECONDS:=2}"
: "${COOLDOWN_SECONDS:=120}"
: "${FIRE_GRACE_SECONDS:=10}"

# Identity of the run. Each pod invocation also gets its own EXEC_ID,
# but CHAIN_ID groups them as one investigation.
: "${CHAIN_PREFIX:=ACB}"
: "${ACTION_DEFAULT:=health}"

# Resolve PROBE_PORTS (csv) into space-separated PROBE_TARGETS for callers.
# Done at source time so callers can `for p in $PROBE_TARGETS; do`.
PROBE_TARGETS=$(printf '%s' "$PROBE_PORTS" | tr ',' ' ')