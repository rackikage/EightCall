server {
    # Wildcard is required: Docker's published-port DNAT targets the container
    # IP, not its loopback, so a 127.0.0.1-only listen would be unreachable.
    # Safe ONLY because compose.yaml publishes this as 127.0.0.1:8088:80 — if
    # that host-side 127.0.0.1 prefix is ever dropped, this port goes to the LAN.
    listen 0.0.0.0:80 default_server;   # IPv4 only
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    # Docker's embedded DNS; resolves the kind node on the private "kind" network
    resolver 127.0.0.11 ipv6=off valid=30s;

    # FLEET dual-chain Node.js pods (kind NodePort, never published on macOS)
    location /node/ {
        set $fleet http://py-box-control-plane:30090;
        proxy_pass $fleet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";   # no client-IP reconstruction
        proxy_set_header X-Real-IP "";
    }

    # loopback sidecar
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
    }
}
