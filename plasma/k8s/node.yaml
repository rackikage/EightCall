apiVersion: v1
kind: Namespace
metadata:
  name: fleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-node
  namespace: fleet
  labels: { app: fleet-node }
spec:
  replicas: 2
  selector:
    matchLabels: { app: fleet-node }
  template:
    metadata:
      labels: { app: fleet-node }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: node
          image: fleet-node:0.1.0
          imagePullPolicy: Never   # loaded into kind by deploy.sh
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # Pods must bind the wildcard so kube-proxy (NodePort) and the
            # kubelet probes can reach the container. The binary defaults to
            # 127.0.0.1; this is the one reviewed place that widens it, and it
            # is never published to the Mac (see Service comment below).
            - { name: HOST, value: "0.0.0.0" }
            - { name: CHAIN_A_NAME, value: alpha }
            - { name: CHAIN_B_NAME, value: beta }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          lifecycle:
            preStop:
              sleep: { seconds: 5 }   # let endpoints drop the pod before SIGTERM
          readinessProbe:
            httpGet: { path: /node/readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /node/healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-node
  namespace: fleet
spec:
  type: NodePort   # node port only; kind maps nothing for it onto macOS
  selector: { app: fleet-node }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30090 }
